services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp-test-server-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mcp_test_server
    ports:
      - "15433:5432"
    volumes:
      - mcp_test_server_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcp_test_server"]
      interval: 3s
      timeout: 5s
      retries: 10

  mcp-test-server.api:
    image: ${DOCKER_REGISTRY-}mcptestserverapi:dev
    build:
      context: .
      dockerfile: src/McpTestServer.API/Dockerfile
    environment:
      MCP_TEST_SERVER_DATA_PROTECTION_KEYS_PATH: /app/data-protection-keys
    volumes:
      - mcp_test_server_dataprotection_keys:/app/data-protection-keys
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mcp_test_server_pgdata:
  mcp_test_server_dataprotection_keys:
