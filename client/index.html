<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Sign in to Cakewalk MCP Test Kitchen to test MCP clients with fault-injection scenarios and a live observation log."
    />
    <meta name="theme-color" content="#14120f" />
    <meta name="robots" content="noindex, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MCP Test Kitchen" />
    <meta
      property="og:description"
      content="Sign in to Cakewalk MCP Test Kitchen to test MCP clients with fault-injection scenarios and a live observation log."
    />
    <meta property="og:site_name" content="Cakewalk" />
    <meta property="og:image" content="https://mcp-test-kitchen.cakewalk.security/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MCP Test Kitchen" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MCP Test Kitchen" />
    <meta
      name="twitter:description"
      content="Sign in to Cakewalk MCP Test Kitchen to test MCP clients with fault-injection scenarios and a live observation log."
    />
    <meta name="twitter:image" content="https://mcp-test-kitchen.cakewalk.security/og-image.png" />
    <meta name="twitter:image:alt" content="MCP Test Kitchen" />
    <script>
      (function () {
        var key = "mcp_test_server_theme";
        var stored = localStorage.getItem(key);
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <title>MCP Test Kitchen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
