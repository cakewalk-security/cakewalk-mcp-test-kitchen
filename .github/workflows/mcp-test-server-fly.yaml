name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mcp-test-server-fly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy mcp-test-server to Fly.io
    # Skip on forks: they have no Fly token and should not deploy.
    if: github.repository == 'cakewalk-security/cakewalk-mcp-test-kitchen'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v4.2.2

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
        with:
          version: 0.4.83

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.MCP_TEST_SERVER_FLY_API_TOKEN }}
